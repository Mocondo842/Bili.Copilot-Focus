name: Fork Build (Win x64 sideload)

# fork 专用：在 GitHub 托管的 Windows runner 上打包 x64 侧载包。
# 与上游 self-hosted 的 build-sideload.yml 的区别：
#   1) runs-on: windows-latest（不依赖自建 runner，也不要求 actor == Richasy）
#   2) 签名用仓库内自带的 focus-sideload.pfx（自签名、CN=Richasy、有效期 10 年）。
#      上游那把 BiliCopilot.UI_TemporaryKey.pfx 的证书已于 2026-09-28 过期，用它会导致
#      APPX0105/APPX0107、产出未签名且无法安装的 msix（run #4 实测）。
#   3) 不发布正式 Release：产物进 **Draft 草稿发布**（Draft-first，不公开、不进 Releases 页面、
#      不触发关注通知），并**自动清理 focus-* 历史发布（含草稿）只保留最近 3 个**，防止列表无限堆积。
#      草稿按 tag 查找的端点会 404，取包必须走「列表端点找 release id → asset id → octet-stream」，
#      构建后会自动回拉一次草稿资产做 sha256 验收；本机拉取命令见构建报告 ci/last-build.md。
#   4) 无论成败都把构建报告推回 ci/logs 分支（无 API token 时的自监督日志通道）
# 本文件只在 focus/derec 分支存在，master 仍是纯上游镜像。

on:
  push:
    branches: [focus/derec]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/fork-build-win-x64.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'MSIX 版本号（x.x.x.x；留空用默认）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

# run 重跑说明：run #27 在 setup-env（外部依赖下载）步骤失败、未进入编译；本次重跑用于区分「外部下载抖动」与「依赖升级导致的还原失败」。
env:
  DEFAULT_VERSION: '2.2511.2.919'
  REPORT_BRANCH: 'ci/logs'
  CERT_FILE: 'focus-sideload.pfx'
  CERT_CER: 'focus-sideload.cer'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard (patch anchors)
        shell: pwsh
        run: |
          $diag = Join-Path $env:RUNNER_TEMP 'diag.log'
          "== guard ==" | Tee-Object -FilePath $diag -Append
          pwsh -File scripts/fork_check.ps1 2>&1 | Tee-Object -FilePath $diag -Append
          if ($LASTEXITCODE -ne 0) { throw "锚点守卫失败（退出码 $LASTEXITCODE）：补丁可能在同步中丢失" }

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "${{ env.DEFAULT_VERSION }}" }
          if ($v -match '^\d+\.\d+\.\d+$') { $v = "$v.0" }
          if ($v -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "版本号格式不对: $v" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "build version = $v"

      - name: Setup environment (libmpv / ffmpeg / .NET / MSBuild)
        uses: ./.github/actions/setup-env
        with:
          version: ${{ steps.ver.outputs.version }}
          sideload: 'true'
          platform: x64
          configuration: Release
          solution-name: src/Bili.Copilot.sln
          manifest-path: src/Desktop/BiliCopilot.UI/Package.appxmanifest
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe runner (advisory, never fails the job)
        shell: pwsh
        continue-on-error: true
        run: |
          $diag = Join-Path $env:RUNNER_TEMP 'diag.log'
          function Show($name, $cmd) {
            $c = Get-Command $cmd -ErrorAction SilentlyContinue
            $line = if ($c) { "$name = $($c.Source)" } else { "$name = (not on PATH)" }
            $line | Tee-Object -FilePath $diag -Append
          }
          "== probe ==" | Tee-Object -FilePath $diag -Append
          (Get-ComputerInfo -Property WindowsProductName, WindowsVersion -ErrorAction SilentlyContinue | Out-String) | Tee-Object -FilePath $diag -Append
          Show 'dotnet' 'dotnet.exe'
          Show 'gh' 'gh.exe'
          Show '7z' '7z.exe'
          Show 'msbuild' 'msbuild.exe'
          $st = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          "signtool = $(if ($st) { $st.FullName } else { '(not found)' })" | Tee-Object -FilePath $diag -Append
          "pfx present = $(Test-Path 'src/Desktop/BiliCopilot.UI/${{ env.CERT_FILE }}')" | Tee-Object -FilePath $diag -Append

      - name: Build x64 sideload package
        id: build
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'build.log'
          $project = 'src/Desktop/BiliCopilot.UI/BiliCopilot.UI.csproj'
          Write-Host "building $project (Release|x64, SideloadOnly, signed)"
          msbuild $project `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:SolutionDir="${{ github.workspace }}\src\" `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="${{ env.CERT_FILE }}" `
            /p:MSBuildWarningsAsErrors=APPX0105%3BAPPX0107 `
            /p:AppxPackageDir="${{ github.workspace }}\AppPackages\" `
            /m /v:minimal 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          "MSBUILD_EXIT=$code" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'exit.txt') -Encoding utf8
          if ($code -ne 0) { throw "msbuild 失败，退出码 $code（日志见 ci/logs 分支的 last-build.md）" }

      - name: Verify package signature
        timeout-minutes: 5
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'AppPackages') -Filter *.msix -Recurse | Select-Object -First 1
          if (-not $msix) { throw '没有找到 .msix' }
          $diag = Join-Path $env:RUNNER_TEMP 'diag.log'
          "== verify $($msix.FullName) ($([math]::Round($msix.Length/1MB,1)) MB) ==" | Tee-Object -FilePath $diag -Append
          # 硬门禁：msix 就是 zip，签名成功的包内必有 AppxSignature.p7x。
          # 这条判据不依赖证书信任链，所以自签名场景也能可靠判定「有没有签名」。
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try { $sig = $zip.Entries | Where-Object { $_.FullName -eq 'AppxSignature.p7x' } } finally { $zip.Dispose() }
          if (-not $sig) { throw 'msix 内没有 AppxSignature.p7x：包未签名（无法安装）' }
          "AppxSignature.p7x = present, $($sig.Length) bytes" | Tee-Object -FilePath $diag -Append
          # 参考信息：signtool 的信任链校验。自签名证书在干净 runner 上建不出受信任链，
          # 只记录、不作为失败依据。
          # 严禁用 certutil/Import-Certificate 把证书导入 Root 存储：那会弹系统确认框、
          # 无人应答就永久阻塞（run #7 挂 30 分钟，run #8/#9/#10 被步骤超时 5 分钟砍掉）。
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName verify /pa /v $msix.FullName 2>&1 | Tee-Object -FilePath $diag -Append
          if ($LASTEXITCODE -ne 0) { Write-Warning 'signtool 信任链校验未通过（自签名场景常见，安装端由 Install.ps1 导入证书）：仅记录' } else { Write-Host 'signtool: 信任链校验通过' }
          exit 0

      - name: Collect packages
        if: success()
        shell: pwsh
        run: |
          $tlog = Join-Path $env:RUNNER_TEMP 'collect.log'
          Start-Transcript -Path $tlog -Force | Out-Null
          try {
            $target = Join-Path $env:GITHUB_WORKSPACE 'FinalPackages'
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            # 注意：四个依赖包同名（Microsoft.WindowsAppRuntime.1.8.msix 的
            # arm64/win32/x64/x86 版本），平铺复制会互相覆盖，最后只剩 x86。
            # 这里显式只取 Dependencies\x64 那一份，保证 x64 机器装得上。
            $appPkgRoot = Join-Path $env:GITHUB_WORKSPACE 'AppPackages'
            $appMsix = Get-ChildItem $appPkgRoot -Filter *.msix -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch '^Microsoft' } | Select-Object -First 1
            if (-not $appMsix) { throw 'AppPackages 下找不到主应用 msix' }
            Write-Host "app: $($appMsix.FullName)"
            Copy-Item $appMsix.FullName -Destination $target -Force
            $depMsix = Get-ChildItem $appPkgRoot -Filter *.msix -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^Microsoft' -and $_.DirectoryName -match '\\Dependencies\\x64$' } | Select-Object -First 1
            if ($depMsix) { Write-Host "dep(x64): $($depMsix.FullName)"; Copy-Item $depMsix.FullName -Destination $target -Force }
            else { Write-Warning '没找到 Dependencies\x64 下的依赖包，跳过' }
            Copy-Item "src/Desktop/BiliCopilot.UI/${{ env.CERT_CER }}" -Destination $target -Force
              # fork 自带安装器：非管理员时自动提权但**留住窗口**、证书用 certutil 静默导入、
            # 失败会把原因显示出来（上游 Install.ps1 非管理员分支会直接 exit，双击只看到闪一下）
            Copy-Item 'scripts/Install-Focus.ps1' -Destination $target -Force
            Copy-Item 'scripts/Install-Focus.cmd' -Destination $target -Force
            Copy-Item 'scripts/fork-install-guide.txt' -Destination (Join-Path $target '安装说明.txt') -Force
            if (-not (Get-ChildItem $target -Filter *.msix)) { throw '没有生成 .msix' }
            # 打一个 zip 方便一次下载；排除 zip 自身
            $zip = Join-Path $target "BiliCopilot-Focus_${{ steps.ver.outputs.version }}_x64.zip"
            Compress-Archive -Path (Get-ChildItem $target -File | Where-Object { $_.Extension -ne '.zip' }).FullName -DestinationPath $zip -Force
            Write-Host '--- FinalPackages ---'
            Get-ChildItem $target | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          } catch {
            Write-Host "COLLECT-ERROR: $($_ | Out-String)"
            throw
          } finally {
            Stop-Transcript | Out-Null
          }

      - name: Publish fork draft release
        if: success()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Start-Transcript -Path (Join-Path $env:RUNNER_TEMP 'release.log') -Force | Out-Null
          $tag = "focus-${{ steps.ver.outputs.version }}"
          # Draft-first：草稿对公众完全不可见（Releases 页面不出现、不触发通知），
          # 资产也没有公开下载链接；取包走 API（见后面的回拉验收步骤与构建报告里的命令）。
          gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq ('.[] | select(.draft and .tag_name=="' + $tag + '") | .id') | ForEach-Object {
            Write-Host "同名草稿 release 已存在（id=$_），删除后重建"
            gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/$_"
          }
          gh release create $tag `
            --draft `
            --target "${{ github.sha }}" `
            (Get-ChildItem "${{ github.workspace }}/FinalPackages" -File | ForEach-Object { $_.FullName }) `
            --title "Focus ${{ steps.ver.outputs.version }} (Win x64 sideload)" `
            --notes "自动构建的 x64 侧载包（去推荐化分支 focus/derec）。安装：双击包内 Install-Focus.cmd（自动提权、信任证书、装依赖与主程序；详见包内安装说明.txt）。草稿发布：不公开，取包命令见 ci/logs 分支构建报告。"
          Stop-Transcript | Out-Null

      - name: Cleanup old focus-* releases (keep latest 3, incl. drafts)
        if: success()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 只保留最近 3 个 focus-* 发布（草稿也占位），更早的连同 tag 一起删，
          # 防止 Release/Tags 列表被每次构建无限堆长。别的 tag 一律不碰。
          $keep = 3
          $rels = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name | startswith("focus-")) | [.created_at, .id, .tag_name] | @tsv' |
            Sort-Object -Descending
          $old = $rels | Select-Object -Skip $keep
          if (-not $old) { Write-Host '没有需要清理的旧发布'; exit 0 }
          foreach ($line in $old) {
            $parts = $line -split "`t"
            $id = $parts[1]; $tag = $parts[2]
            Write-Host "清理旧发布 $tag (id=$id)"
            gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/$id"
            # 已发布过的 release 删除后 tag 会留下；草稿发布多数没建出 tag，404 就跳过
            gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" 2>$null
            if ($LASTEXITCODE -eq 0) { Write-Host "  tag $tag 已删" } else { Write-Host "  tag $tag 不存在，跳过" }
          }

      - name: Upload artifact
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: BiliCopilot-Focus-${{ steps.ver.outputs.version }}-x64
          path: ${{ github.workspace }}/FinalPackages/*
          if-no-files-found: error

      - name: Verify draft asset via API (download back, compare sha256)
        if: success()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $diag = Join-Path $env:RUNNER_TEMP 'diag.log'
          $zip = Get-ChildItem "${{ github.workspace }}/FinalPackages" -Filter *.zip | Select-Object -First 1
          if (-not $zip) { Write-Warning '没有 zip 可比对'; exit 0 }
          $local = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash
          # 草稿 release 用「按 tag 查找」的端点会 404（gh release download 也走它），
          # 必须走列表端点拿 release id，再按 asset id 以 octet-stream 拉回——
          # 这一步同时就是「协作者凭 API 取草稿资产」链路的自动验收。
          "== 草稿资产回拉验收 ==" | Tee-Object -FilePath $diag -Append
          $tag = "focus-${{ steps.ver.outputs.version }}"
          $relId = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq ('.[] | select(.draft and .tag_name=="' + $tag + '") | .id') | Select-Object -First 1
          if (-not $relId) { throw "找不到草稿 release $tag（草稿创建步骤失败了？）" }
          "draft release id = $relId" | Tee-Object -FilePath $diag -Append
          $assetId = gh api "repos/$env:GITHUB_REPOSITORY/releases/$relId" --jq ('.assets[] | select(.name=="' + $zip.Name + '") | .id') | Select-Object -First 1
          if (-not $assetId) { throw "草稿 release 里没有 $($zip.Name)" }
          $dir = Join-Path $env:RUNNER_TEMP 'redownload'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = Join-Path $dir $zip.Name
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream' }
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$assetId" -Headers $headers -OutFile $file
          $remote = (Get-FileHash $file -Algorithm SHA256).Hash
          "local  sha256 = $local" | Tee-Object -FilePath $diag -Append
          "remote sha256 = $remote" | Tee-Object -FilePath $diag -Append
          if ($local -ne $remote) { throw '回拉的资产与本地产出 sha256 不一致' }
          Write-Host '草稿资产 API 回拉成功，sha256 一致' | Tee-Object -FilePath $diag -Append

      # 无论成败都把报告推回 ci/logs：这是无 API token 时唯一能读到构建日志的通道
      - name: Push build report to ci/logs
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'build.log'
          $diag = Join-Path $env:RUNNER_TEMP 'diag.log'
          $exitFile = Join-Path $env:RUNNER_TEMP 'exit.txt'
          $exitCode = if (Test-Path $exitFile) { (Get-Content $exitFile -Raw).Trim() } else { '(未执行到构建步骤)' }
          $lines = if (Test-Path $log) { Get-Content $log } else { @('(没有日志文件)') }
          $errs = $lines | Select-String -Pattern 'error [A-Z]{2,}\d+|error MSB\d+|: error|Exception|FAILED' | Select-Object -Last 80
          $msix = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'AppPackages') -Filter *.msix -Recurse -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path 'ci' | Out-Null
          $body = @(
            "# Fork build report"
            ""
            "| 项 | 值 |"
            "|---|---|"
            "| run id | ${{ github.run_id }} (#${{ github.run_number }}) |"
            "| ref | ${{ github.ref_name }} |"
            "| commit | ${{ github.sha }} |"
            "| 版本 | ${{ steps.ver.outputs.version }} |"
            "| job 状态 | ${{ job.status }} |"
            "| msbuild 退出码 | ``$exitCode`` |"
            "| 产物 | $(if ($msix) { ($msix | ForEach-Object { $_.Name + ' (' + [math]::Round($_.Length/1MB,1) + ' MB)' }) -join ', ' } else { '无 .msix' }) |"
            ""
            "## 错误行（最多 80 条）"
            ""
            '```'
            ($(if ($errs) { $errs -join "`n" } else { '(无匹配的错误行)' }))
            '```'
            ""
            "## 早期步骤与签名校验诊断（diag.log 尾部 150 行）"
            ""
            '```'
            ($(if (Test-Path $diag) { (Get-Content $diag | Select-Object -Last 150) -join "`n" } else { '(没有 diag.log：任务在到达这些步骤前就结束了)' }))
            '```'
            ""
            "## collect / release transcript（各 60 行）"
            ""
            '```'
            ($(if (Test-Path (Join-Path $env:RUNNER_TEMP 'collect.log')) { (Get-Content (Join-Path $env:RUNNER_TEMP 'collect.log') | Select-Object -Last 60) -join "`n" } else { '(没有 collect.log)' }))
            '```'
            ""
            '```'
            ($(if (Test-Path (Join-Path $env:RUNNER_TEMP 'release.log')) { (Get-Content (Join-Path $env:RUNNER_TEMP 'release.log') | Select-Object -Last 60) -join "`n" } else { '(没有 release.log)' }))
            '```'
            ""
            "## FinalPackages 清单"
            ""
            '```'
            ($(try { (Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'FinalPackages') -ErrorAction Stop | ForEach-Object { $_.Name + '  ' + [math]::Round($_.Length/1MB,1) + ' MB' }) -join "`n" } catch { '(列不出 FinalPackages)' }))
            '```'
            ""
            "## 拉取本次产物（草稿发布；gh 2.103+ 已支持按 tag 下载草稿，一行即可，整行复制执行）"
            ""
            '```powershell'
            'gh release download focus-${{ steps.ver.outputs.version }} --repo Mocondo842/Bili.Copilot-Focus --pattern "*.zip" --clobber'
            '```'
            ""
            "## 交付脚本行尾/编码体检"
            ""
            '```'
            ($(foreach ($f in @('scripts/Install-Focus.cmd', 'scripts/Install-Focus.ps1', 'scripts/fork-install-guide.txt')) {
                $raw = [IO.File]::ReadAllText((Resolve-Path $f))
                $crlf = ([regex]::Matches($raw, "`r`n")).Count
                $bareLf = ([regex]::Matches($raw, "(?<!`r)`n")).Count
                $head = ([IO.File]::ReadAllBytes((Resolve-Path $f))[0..2] -join ',')
                "$f : CRLF=$crlf 裸LF=$bareLf 前三字节=$head"
            }) -join "`n")
            '```'
            ""
            "## 构建日志尾部（250 行）"
            ""
            '```'
            ($lines | Select-Object -Last 250 | Out-String)
            '```'
          ) -join "`n"
          Set-Content -Path 'ci/last-build.md' -Value $body -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ci/last-build.md
          git commit -m "ci: build report #${{ github.run_number }} (exit=$exitCode)" --no-verify
          git push --force origin "HEAD:${{ env.REPORT_BRANCH }}" 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'push.log')
          if ($LASTEXITCODE -ne 0) {
            Write-Warning '报告分支推送失败（通常是 GITHUB_TOKEN 只有只读权限）：构建日志无法回传。'
            Get-Content (Join-Path $env:RUNNER_TEMP 'push.log') -ErrorAction SilentlyContinue
            exit 0
          }
          Write-Host '报告已推送'
