name: Fork Build (Win x64 sideload)

# fork 专用：在 GitHub 托管的 Windows runner 上打包 x64 侧载包。
# 与上游 self-hosted 的 build-sideload.yml 的区别：
#   1) runs-on: windows-latest（不依赖自建 runner，也不要求 actor == Richasy）
#   2) 签名用仓库内自带的 focus-sideload.pfx（自签名、CN=Richasy、有效期 10 年）。
#      上游那把 BiliCopilot.UI_TemporaryKey.pfx 的证书已于 2026-09-28 过期，用它会导致
#      APPX0105/APPX0107、产出未签名且无法安装的 msix（run #4 实测）。
#   3) 不发布正式 Release，只传 artifact + 建一个 focus-* 预发布（同名先删后建）
#   4) 无论成败都把构建报告推回 ci/logs 分支（无 API token 时的自监督日志通道）
# 本文件只在 focus/derec 分支存在，master 仍是纯上游镜像。

on:
  push:
    branches: [focus/derec]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/fork-build-win-x64.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'MSIX 版本号（x.x.x.x；留空用默认）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_VERSION: '2.2511.2.900'
  REPORT_BRANCH: 'ci/logs'
  CERT_FILE: 'focus-sideload.pfx'
  CERT_CER: 'focus-sideload.cer'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard (patch anchors)
        shell: pwsh
        run: |
          $diag = Join-Path $env:RUNNER_TEMP 'diag.log'
          "== guard ==" | Tee-Object -FilePath $diag -Append
          pwsh -File scripts/fork_check.ps1 2>&1 | Tee-Object -FilePath $diag -Append
          if ($LASTEXITCODE -ne 0) { throw "锚点守卫失败（退出码 $LASTEXITCODE）：补丁可能在同步中丢失" }

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "${{ env.DEFAULT_VERSION }}" }
          if ($v -match '^\d+\.\d+\.\d+$') { $v = "$v.0" }
          if ($v -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "版本号格式不对: $v" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "build version = $v"

      - name: Setup environment (libmpv / ffmpeg / .NET / MSBuild)
        uses: ./.github/actions/setup-env
        with:
          version: ${{ steps.ver.outputs.version }}
          sideload: 'true'
          platform: x64
          configuration: Release
          solution-name: src/Bili.Copilot.sln
          manifest-path: src/Desktop/BiliCopilot.UI/Package.appxmanifest
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe runner (advisory, never fails the job)
        shell: pwsh
        continue-on-error: true
        run: |
          $diag = Join-Path $env:RUNNER_TEMP 'diag.log'
          function Show($name, $cmd) {
            $c = Get-Command $cmd -ErrorAction SilentlyContinue
            $line = if ($c) { "$name = $($c.Source)" } else { "$name = (not on PATH)" }
            $line | Tee-Object -FilePath $diag -Append
          }
          "== probe ==" | Tee-Object -FilePath $diag -Append
          (Get-ComputerInfo -Property WindowsProductName, WindowsVersion -ErrorAction SilentlyContinue | Out-String) | Tee-Object -FilePath $diag -Append
          Show 'dotnet' 'dotnet.exe'
          Show 'gh' 'gh.exe'
          Show '7z' '7z.exe'
          Show 'msbuild' 'msbuild.exe'
          $st = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          "signtool = $(if ($st) { $st.FullName } else { '(not found)' })" | Tee-Object -FilePath $diag -Append
          "pfx present = $(Test-Path 'src/Desktop/BiliCopilot.UI/${{ env.CERT_FILE }}')" | Tee-Object -FilePath $diag -Append

      - name: Build x64 sideload package
        id: build
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'build.log'
          $project = 'src/Desktop/BiliCopilot.UI/BiliCopilot.UI.csproj'
          Write-Host "building $project (Release|x64, SideloadOnly, signed)"
          msbuild $project `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:SolutionDir="${{ github.workspace }}\src\" `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="${{ env.CERT_FILE }}" `
            /p:MSBuildWarningsAsErrors=APPX0105,APPX0107 `
            /p:AppxPackageDir="${{ github.workspace }}\AppPackages\" `
            /m /v:minimal 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          "MSBUILD_EXIT=$code" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'exit.txt') -Encoding utf8
          if ($code -ne 0) { throw "msbuild 失败，退出码 $code（日志见 ci/logs 分支的 last-build.md）" }

      - name: Verify package signature
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'AppPackages') -Filter *.msix -Recurse | Select-Object -First 1
          if (-not $msix) { throw '没有找到 .msix' }
          $diag = Join-Path $env:RUNNER_TEMP 'diag.log'
          "== verify $($msix.Name) ==" | Tee-Object -FilePath $diag -Append
          $imported = $true
          try {
            Import-Certificate -FilePath "src/Desktop/BiliCopilot.UI/${{ env.CERT_CER }}" -CertStoreLocation Cert:\CurrentUser\Root -ErrorAction Stop | Out-Null
          } catch {
            $imported = $false
            Write-Warning "导入证书到 CurrentUser\Root 失败：$_（跳过信任链校验，仅确认签名存在）"
          }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName verify /pa /v $msix.FullName 2>&1 | Tee-Object -FilePath $diag -Append
          $vc = $LASTEXITCODE
          if ($vc -ne 0 -and $imported) { throw "签名校验失败（signtool 退出码 $vc）" }
          if ($vc -ne 0) { Write-Warning "signtool 退出码 $vc（证书未能导入信任链，仅记录）" }

      - name: Collect packages
        if: success()
        shell: pwsh
        run: |
          $target = Join-Path $env:GITHUB_WORKSPACE 'FinalPackages'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'AppPackages') -Include *.msix -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "copy $($_.Name)"; Copy-Item $_.FullName -Destination $target -Force }
          Copy-Item "src/Desktop/BiliCopilot.UI/${{ env.CERT_CER }}" -Destination $target -Force
          Copy-Item 'scripts/Install.ps1' -Destination $target -Force
          if (Test-Path 'docs/sideload-guide.txt') { Copy-Item 'docs/sideload-guide.txt' -Destination (Join-Path $target '安装说明.txt') -Force }
          if (-not (Get-ChildItem $target -Filter *.msix)) { throw '没有生成 .msix' }
          $zip = Join-Path $target "BiliCopilot-Focus_${{ steps.ver.outputs.version }}_x64.zip"
          Compress-Archive -Path (Get-ChildItem $target -File | Where-Object { $_.Extension -ne '.zip' }).FullName -DestinationPath $zip -Force
          Get-ChildItem $target | Select-Object Name, Length | Format-Table

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BiliCopilot-Focus-${{ steps.ver.outputs.version }}-x64
          path: ${{ github.workspace }}/FinalPackages/*
          if-no-files-found: error

      - name: Publish fork prerelease
        if: success()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "focus-${{ steps.ver.outputs.version }}"
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "同名 release $tag 已存在，删除后重建（早先那份是未签名的失败产物）"
            gh release delete $tag --yes --cleanup-tag
          }
          gh release create $tag `
            (Get-ChildItem "${{ github.workspace }}/FinalPackages" -File | ForEach-Object { $_.FullName }) `
            --title "Focus ${{ steps.ver.outputs.version }} (Win x64 sideload)" `
            --notes "自动构建的 x64 侧载包（去推荐化分支 focus/derec）。安装：以管理员运行包内 Install.ps1（先导入 focus-sideload.cer，再装 msix）。" `
            --prerelease

      # 无论成败都把报告推回 ci/logs：这是无 API token 时唯一能读到构建日志的通道
      - name: Push build report to ci/logs
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'build.log'
          $diag = Join-Path $env:RUNNER_TEMP 'diag.log'
          $exitFile = Join-Path $env:RUNNER_TEMP 'exit.txt'
          $exitCode = if (Test-Path $exitFile) { (Get-Content $exitFile -Raw).Trim() } else { '(未执行到构建步骤)' }
          $lines = if (Test-Path $log) { Get-Content $log } else { @('(没有日志文件)') }
          $errs = $lines | Select-String -Pattern 'error [A-Z]{2,}\d+|error MSB\d+|: error|Exception|FAILED' | Select-Object -Last 80
          $msix = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'AppPackages') -Filter *.msix -Recurse -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path 'ci' | Out-Null
          $body = @(
            "# Fork build report"
            ""
            "| 项 | 值 |"
            "|---|---|"
            "| run id | ${{ github.run_id }} (#${{ github.run_number }}) |"
            "| ref | ${{ github.ref_name }} |"
            "| commit | ${{ github.sha }} |"
            "| 版本 | ${{ steps.ver.outputs.version }} |"
            "| job 状态 | ${{ job.status }} |"
            "| msbuild 退出码 | ``$exitCode`` |"
            "| 产物 | $(if ($msix) { ($msix | ForEach-Object { $_.Name + ' (' + [math]::Round($_.Length/1MB,1) + ' MB)' }) -join ', ' } else { '无 .msix' }) |"
            ""
            "## 错误行（最多 80 条）"
            ""
            '```'
            ($(if ($errs) { $errs -join "`n" } else { '(无匹配的错误行)' }))
            '```'
            ""
            "## 早期步骤与签名校验诊断（diag.log 尾部 150 行）"
            ""
            '```'
            ($(if (Test-Path $diag) { (Get-Content $diag | Select-Object -Last 150) -join "`n" } else { '(没有 diag.log：任务在到达这些步骤前就结束了)' }))
            '```'
            ""
            "## 构建日志尾部（250 行）"
            ""
            '```'
            ($lines | Select-Object -Last 250 | Out-String)
            '```'
          ) -join "`n"
          Set-Content -Path 'ci/last-build.md' -Value $body -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ci/last-build.md
          git commit -m "ci: build report #${{ github.run_number }} (exit=$exitCode)" --no-verify
          git push --force origin "HEAD:${{ env.REPORT_BRANCH }}" 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'push.log')
          if ($LASTEXITCODE -ne 0) {
            Write-Warning '报告分支推送失败（通常是 GITHUB_TOKEN 只有只读权限）：构建日志无法回传。'
            Get-Content (Join-Path $env:RUNNER_TEMP 'push.log') -ErrorAction SilentlyContinue
            exit 0
          }
          Write-Host '报告已推送'
